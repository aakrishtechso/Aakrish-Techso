<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9D9FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A98BE3"/>
      <stop offset="100%" stop-color="#CDB7F6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A98BE3"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A98BE3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E9D9FF" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Main Window Container -->
  <g transform="translate(40, 30)" filter="url(#cardShadow)">
    <rect width="720" height="390" rx="16" fill="#FFFFFF" stroke="#CDB7F6" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="720" height="44" rx="16" fill="#F6F2FF"/>
    <rect y="32" width="720" height="12" fill="#F6F2FF"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="#E9D9FF" stroke-width="1.5"/>
    
    <!-- Window dots -->
    <circle cx="28" cy="22" r="5" fill="#FDA4AF"/>
    <circle cx="44" cy="22" r="5" fill="#FCD34D"/>
    <circle cx="60" cy="22" r="5" fill="#86EFAC"/>
    
    <!-- Header title -->
    <rect x="260" y="12" width="200" height="20" rx="6" fill="#FFFFFF" stroke="#E9D9FF"/>
    <text x="360" y="26" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DSA Game Hub • Visual Challenge</text>
    <rect x="610" y="12" width="90" height="20" rx="6" fill="#A98BE3" opacity="0.15"/>
    <text x="655" y="26" fill="#6D28D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LVL 07 • ACTIVE</text>

    <!-- Left Panel: Interactive Binary Tree & Graph Visualizer -->
    <g transform="translate(24, 60)">
      <rect width="400" height="305" rx="12" fill="#FAF8FF" stroke="#E9D9FF" stroke-width="1"/>
      
      <!-- Panel Header -->
      <text x="18" y="28" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Binary Search Tree • BFS Traversal</text>
      <text x="18" y="44" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Target Node: 42 • Time: O(log N)</text>
      
      <!-- Tree Connecting Edges -->
      <line x1="200" y1="90" x2="110" y2="150" stroke="#CDB7F6" stroke-width="2.5" stroke-dasharray="4 2"/>
      <line x1="200" y1="90" x2="290" y2="150" stroke="#CDB7F6" stroke-width="2.5"/>
      <line x1="110" y1="150" x2="65" y2="215" stroke="#CDB7F6" stroke-width="2"/>
      <line x1="110" y1="150" x2="155" y2="215" stroke="#CDB7F6" stroke-width="2"/>
      <line x1="290" y1="150" x2="245" y2="215" stroke="#CDB7F6" stroke-width="2"/>
      <line x1="290" y1="150" x2="335" y2="215" stroke="#A98BE3" stroke-width="3"/>

      <!-- Root Node (50) -->
      <circle cx="200" cy="90" r="22" fill="url(#nodeGrad)"/>
      <circle cx="200" cy="90" r="25" fill="none" stroke="#A98BE3" stroke-width="2" opacity="0.4"/>
      <text x="200" y="95" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">50</text>

      <!-- Level 1 Nodes -->
      <circle cx="110" cy="150" r="18" fill="#FFFFFF" stroke="#CDB7F6" stroke-width="2"/>
      <text x="110" y="154" fill="#6D28D9" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">25</text>

      <circle cx="290" cy="150" r="18" fill="#FFFFFF" stroke="#A98BE3" stroke-width="2"/>
      <text x="290" y="154" fill="#6D28D9" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">75</text>

      <!-- Level 2 Nodes -->
      <circle cx="65" cy="215" r="16" fill="#FFFFFF" stroke="#E9D9FF" stroke-width="2"/>
      <text x="65" y="219" fill="#4B5563" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">12</text>

      <circle cx="155" cy="215" r="16" fill="#FFFFFF" stroke="#E9D9FF" stroke-width="2"/>
      <text x="155" y="219" fill="#4B5563" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">38</text>

      <circle cx="245" cy="215" r="16" fill="#FFFFFF" stroke="#E9D9FF" stroke-width="2"/>
      <text x="245" y="219" fill="#4B5563" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">60</text>

      <!-- Target Node Highlighted (42 / Found!) -->
      <circle cx="335" cy="215" r="19" fill="#7C3AED"/>
      <circle cx="335" cy="215" r="24" fill="none" stroke="#A98BE3" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="335" y="220" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">85</text>

      <!-- Sorting Bar Graph Mini Tracker -->
      <g transform="translate(18, 255)">
        <rect width="364" height="38" rx="8" fill="#FFFFFF" stroke="#E9D9FF"/>
        <text x="12" y="23" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Sorting Step:</text>
        <rect x="90" y="12" width="16" height="18" rx="3" fill="#CDB7F6"/>
        <rect x="112" y="8" width="16" height="22" rx="3" fill="#A98BE3"/>
        <rect x="134" y="14" width="16" height="16" rx="3" fill="#E9D9FF"/>
        <rect x="156" y="5" width="16" height="25" rx="3" fill="#7C3AED"/>
        <rect x="178" y="10" width="16" height="20" rx="3" fill="#CDB7F6"/>
        <rect x="200" y="16" width="16" height="14" rx="3" fill="#E9D9FF"/>
        <text x="350" y="24" fill="#059669" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">SORTED ✓</text>
      </g>
    </g>

    <!-- Right Panel: Game Stats & Code Editor Challenge -->
    <g transform="translate(440, 60)">
      <!-- Score & Streak Card -->
      <rect width="256" height="88" rx="12" fill="#FAF8FF" stroke="#E9D9FF"/>
      <text x="16" y="26" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">Game Score</text>
      <text x="16" y="55" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">2,850 pts</text>
      <rect x="165" y="18" width="76" height="24" rx="12" fill="#E9D9FF"/>
      <text x="203" y="34" fill="#6D28D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔥 12 Streak</text>
      <rect x="16" y="68" width="224" height="6" rx="3" fill="#E9D9FF"/>
      <rect x="16" y="68" width="180" height="6" rx="3" fill="url(#accentGrad)"/>

      <!-- Code Snippet / Challenge Module -->
      <g transform="translate(0, 102)">
        <rect width="256" height="203" rx="12" fill="#1E1B4B" stroke="#A98BE3" stroke-width="1"/>
        <rect width="256" height="28" rx="12" fill="#17143A"/>
        <rect y="20" width="256" height="8" fill="#17143A"/>
        <text x="14" y="18" fill="#CDB7F6" font-family="monospace" font-size="10">algoChallenge.js</text>
        <circle cx="240" cy="14" r="3" fill="#86EFAC"/>
        
        <!-- Code lines -->
        <text x="14" y="48" fill="#818CF8" font-family="monospace" font-size="10.5">function <tspan fill="#FCD34D">binarySearch</tspan>(arr, k) {</text>
        <text x="24" y="68" fill="#9CA3AF" font-family="monospace" font-size="10.5">  let low = 0, high = arr.len - 1;</text>
        <text x="24" y="88" fill="#A98BE3" font-family="monospace" font-size="10.5">  while (low &lt;= high) {</text>
        <text x="36" y="108" fill="#CDB7F6" font-family="monospace" font-size="10.5">    const mid = (low + high) >> 1;</text>
        <text x="36" y="128" fill="#86EFAC" font-family="monospace" font-size="10.5">    if (arr[mid] === k) return mid;</text>
        <text x="36" y="148" fill="#CDB7F6" font-family="monospace" font-size="10.5">    arr[mid] &lt; k ? low = mid+1 : ...</text>
        <text x="24" y="168" fill="#A98BE3" font-family="monospace" font-size="10.5">  }</text>
        <text x="14" y="186" fill="#818CF8" font-family="monospace" font-size="10.5">}</text>
      </g>
    </g>
  </g>
</svg>
