<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="portBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F6F2FF"/>
      <stop offset="100%" stop-color="#E9D9FF"/>
    </linearGradient>
    <linearGradient id="purpleBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A98BE3"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="portShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A98BE3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#portBgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="portGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E9D9FF" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="800" height="450" fill="url(#portGrid)"/>

  <!-- Main Application Container -->
  <g transform="translate(40, 30)" filter="url(#portShadow)">
    <rect width="720" height="390" rx="16" fill="#FFFFFF" stroke="#CDB7F6" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="720" height="44" rx="16" fill="#F6F2FF"/>
    <rect y="32" width="720" height="12" fill="#F6F2FF"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="#E9D9FF" stroke-width="1.5"/>

    <!-- Window controls -->
    <circle cx="28" cy="22" r="5" fill="#FDA4AF"/>
    <circle cx="44" cy="22" r="5" fill="#FCD34D"/>
    <circle cx="60" cy="22" r="5" fill="#86EFAC"/>

    <!-- URL Bar -->
    <rect x="230" y="12" width="260" height="20" rx="6" fill="#FFFFFF" stroke="#E9D9FF"/>
    <text x="360" y="26" fill="#7C3AED" font-family="monospace" font-size="10.5" text-anchor="middle">ajeetlodhii.github.io/Portfolio/</text>
    
    <rect x="610" y="12" width="90" height="20" rx="6" fill="#A98BE3" opacity="0.15"/>
    <text x="655" y="26" fill="#6D28D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PORTFOLIO</text>

    <!-- Content Inside Portfolio Mockup -->
    <g transform="translate(24, 60)">
      <!-- Mini Nav in Mockup -->
      <rect width="672" height="32" rx="8" fill="#FAF8FF" stroke="#E9D9FF"/>
      <circle cx="20" cy="16" r="8" fill="#A98BE3"/>
      <text x="36" y="20" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">AJEET PATEL</text>
      
      <g transform="translate(430, 11)">
        <text x="0" y="9" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">About</text>
        <text x="50" y="9" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Skills</text>
        <text x="95" y="9" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Projects</text>
        <text x="150" y="9" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Contact</text>
      </g>

      <!-- Hero Section of Portfolio -->
      <g transform="translate(0, 44)">
        <rect width="672" height="120" rx="12" fill="#FAF8FF" stroke="#E9D9FF"/>
        
        <!-- Hero Text -->
        <rect x="20" y="16" width="110" height="18" rx="9" fill="#E9D9FF"/>
        <text x="75" y="29" fill="#6D28D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">⚡ Full Stack Engineer</text>
        
        <text x="20" y="58" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Building High Performance Web Experiences</text>
        <text x="20" y="76" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Specializing in modern React ecosystems, scalable web applications, and intuitive UI/UX design.</text>
        
        <!-- CTA button -->
        <rect x="20" y="88" width="96" height="22" rx="6" fill="url(#purpleBtnGrad)"/>
        <text x="68" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">View Projects →</text>

        <!-- Tech tags -->
        <g transform="translate(130, 88)">
          <rect x="0" y="0" width="55" height="22" rx="6" fill="#FFFFFF" stroke="#CDB7F6"/>
          <text x="27" y="15" fill="#6D28D9" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">React</text>

          <rect x="62" y="0" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#CDB7F6"/>
          <text x="97" y="15" fill="#6D28D9" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">JavaScript</text>

          <rect x="139" y="0" width="75" height="22" rx="6" fill="#FFFFFF" stroke="#CDB7F6"/>
          <text x="176" y="15" fill="#6D28D9" font-family="monospace" font-size="9.5" font-weight="600" text-anchor="middle">Tailwind CSS</text>
        </g>
      </g>

      <!-- Featured Project Cards Row Inside Portfolio -->
      <g transform="translate(0, 174)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="216" height="130" rx="10" fill="#FFFFFF" stroke="#E9D9FF" filter="drop-shadow(0 2px 4px rgba(169,139,227,0.1))"/>
          <rect x="10" y="10" width="196" height="56" rx="6" fill="#F6F2FF" stroke="#E9D9FF"/>
          <circle cx="30" cy="38" r="14" fill="#A98BE3" opacity="0.2"/>
          <text x="30" y="42" fill="#7C3AED" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
          <text x="56" y="34" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">DSA Game Hub</text>
          <text x="56" y="46" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Interactive Algorithms</text>
          <text x="12" y="82" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Algorithm Visualizer</text>
          <text x="12" y="96" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Gamified challenges & trees</text>
          <text x="12" y="118" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Live Demo ↗</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(228, 0)">
          <rect width="216" height="130" rx="10" fill="#FFFFFF" stroke="#E9D9FF" filter="drop-shadow(0 2px 4px rgba(169,139,227,0.1))"/>
          <rect x="10" y="10" width="196" height="56" rx="6" fill="#F6F2FF" stroke="#E9D9FF"/>
          <circle cx="30" cy="38" r="14" fill="#CDB7F6" opacity="0.3"/>
          <text x="30" y="42" fill="#6D28D9" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">AI</text>
          <text x="56" y="34" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Resume Analyzer</text>
          <text x="56" y="46" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">ATS Audit System</text>
          <text x="12" y="82" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Smart Resume Tool</text>
          <text x="12" y="96" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Keyword & ATS scoring</text>
          <text x="12" y="118" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Live Demo ↗</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(456, 0)">
          <rect width="216" height="130" rx="10" fill="#FFFFFF" stroke="#E9D9FF" filter="drop-shadow(0 2px 4px rgba(169,139,227,0.1))"/>
          <rect x="10" y="10" width="196" height="56" rx="6" fill="#F6F2FF" stroke="#E9D9FF"/>
          <circle cx="30" cy="38" r="14" fill="#86EFAC" opacity="0.4"/>
          <text x="30" y="42" fill="#047857" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">★</text>
          <text x="56" y="34" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Web Development</text>
          <text x="56" y="46" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Modern Web Apps</text>
          <text x="12" y="82" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Production Clients</text>
          <text x="12" y="96" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Enterprise scale & UX</text>
          <text x="12" y="118" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Explore ↗</text>
        </g>
      </g>
    </g>
  </g>
</svg>
