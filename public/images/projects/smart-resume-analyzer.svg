<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="resBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F6F2FF"/>
      <stop offset="100%" stop-color="#E9D9FF"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A98BE3"/>
    </linearGradient>
    <filter id="resShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A98BE3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#resBgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="resGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E9D9FF" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="800" height="450" fill="url(#resGrid)"/>

  <!-- Main Application Container -->
  <g transform="translate(40, 30)" filter="url(#resShadow)">
    <rect width="720" height="390" rx="16" fill="#FFFFFF" stroke="#CDB7F6" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="720" height="44" rx="16" fill="#F6F2FF"/>
    <rect y="32" width="720" height="12" fill="#F6F2FF"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="#E9D9FF" stroke-width="1.5"/>

    <!-- Window buttons -->
    <circle cx="28" cy="22" r="5" fill="#FDA4AF"/>
    <circle cx="44" cy="22" r="5" fill="#FCD34D"/>
    <circle cx="60" cy="22" r="5" fill="#86EFAC"/>

    <!-- Header bar -->
    <rect x="250" y="12" width="220" height="20" rx="6" fill="#FFFFFF" stroke="#E9D9FF"/>
    <text x="360" y="26" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Resume Analyzer • AI Audit</text>
    <rect x="590" y="12" width="110" height="20" rx="6" fill="#10B981" opacity="0.15"/>
    <text x="645" y="26" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ATS READY (94%)</text>

    <!-- Left Column: Resume Document Representation -->
    <g transform="translate(24, 60)">
      <rect width="320" height="305" rx="12" fill="#FAF8FF" stroke="#E9D9FF" stroke-width="1"/>
      
      <!-- Resume Sheet -->
      <g transform="translate(20, 16)">
        <rect width="280" height="272" rx="8" fill="#FFFFFF" stroke="#E9D9FF" filter="drop-shadow(0 2px 4px rgba(169,139,227,0.1))"/>
        
        <!-- Header Info -->
        <rect x="18" y="18" width="40" height="40" rx="20" fill="#E9D9FF"/>
        <text x="38" y="43" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">AP</text>
        
        <text x="68" y="32" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Ajeet Patel</text>
        <text x="68" y="47" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Full Stack Software Developer</text>
        
        <line x1="18" y1="68" x2="262" y2="68" stroke="#F1EAFF" stroke-width="1.5"/>

        <!-- Section: Summary -->
        <rect x="18" y="78" width="80" height="8" rx="4" fill="#CDB7F6"/>
        <rect x="18" y="92" width="244" height="6" rx="3" fill="#F1EAFF"/>
        <rect x="18" y="103" width="220" height="6" rx="3" fill="#F1EAFF"/>
        <rect x="18" y="114" width="180" height="6" rx="3" fill="#F1EAFF"/>

        <!-- Section: Skills Matched -->
        <rect x="18" y="132" width="60" height="8" rx="4" fill="#CDB7F6"/>
        <g transform="translate(18, 146)">
          <rect x="0" y="0" width="48" height="16" rx="8" fill="#F6F2FF" stroke="#CDB7F6"/>
          <text x="24" y="11" fill="#6D28D9" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">React</text>

          <rect x="54" y="0" width="62" height="16" rx="8" fill="#F6F2FF" stroke="#CDB7F6"/>
          <text x="85" y="11" fill="#6D28D9" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">TypeScript</text>

          <rect x="122" y="0" width="56" height="16" rx="8" fill="#F6F2FF" stroke="#CDB7F6"/>
          <text x="150" y="11" fill="#6D28D9" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Node.js</text>

          <rect x="184" y="0" width="52" height="16" rx="8" fill="#F6F2FF" stroke="#CDB7F6"/>
          <text x="210" y="11" fill="#6D28D9" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Python</text>
        </g>

        <!-- Section: Experience Highlights -->
        <rect x="18" y="174" width="90" height="8" rx="4" fill="#CDB7F6"/>
        <rect x="18" y="188" width="140" height="7" rx="3" fill="#A98BE3" opacity="0.6"/>
        <rect x="18" y="200" width="244" height="5" rx="2" fill="#F1EAFF"/>
        <rect x="18" y="210" width="230" height="5" rx="2" fill="#F1EAFF"/>
        <rect x="18" y="220" width="200" height="5" rx="2" fill="#F1EAFF"/>
        
        <!-- Audit Tag -->
        <rect x="18" y="238" width="244" height="22" rx="6" fill="#10B981" opacity="0.1"/>
        <text x="28" y="253" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">✓ Keywords matched: 18 of 20 relevant tags</text>
      </g>
    </g>

    <!-- Right Column: AI Analysis & Metrics -->
    <g transform="translate(364, 60)">
      <!-- Top Metrics Row -->
      <g>
        <rect width="332" height="100" rx="12" fill="#FAF8FF" stroke="#E9D9FF"/>
        
        <!-- Score Circular Gauge -->
        <g transform="translate(55, 50)">
          <circle cx="0" cy="0" r="34" fill="none" stroke="#E9D9FF" stroke-width="6"/>
          <circle cx="0" cy="0" r="34" fill="none" stroke="url(#scoreGrad)" stroke-width="6" stroke-dasharray="213" stroke-dashoffset="20" stroke-linecap="round" transform="rotate(-90)"/>
          <text x="0" y="7" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">94</text>
          <text x="0" y="19" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">/100</text>
        </g>
        
        <text x="115" y="36" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Resume Health Score</text>
        <text x="115" y="54" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">High Match Rate for Tech Roles</text>
        <text x="115" y="72" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Parsed in 0.4s • ATS Compliant</text>
      </g>

      <!-- AI Recommendations Cards -->
      <g transform="translate(0, 114)">
        <rect width="332" height="191" rx="12" fill="#FAF8FF" stroke="#E9D9FF"/>
        <text x="16" y="24" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AI Improvement Breakdown</text>

        <!-- Item 1 -->
        <g transform="translate(16, 36)">
          <rect width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E9D9FF"/>
          <circle cx="20" cy="21" r="10" fill="#10B981" opacity="0.15"/>
          <text x="20" y="25" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
          <text x="38" y="18" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Action Verbs & Impact Metrics</text>
          <text x="38" y="32" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Quantified achievements verified across 4 bullet points</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(16, 86)">
          <rect width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E9D9FF"/>
          <circle cx="20" cy="21" r="10" fill="#A98BE3" opacity="0.2"/>
          <text x="20" y="25" fill="#6D28D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">★</text>
          <text x="38" y="18" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Skills Alignment Suggestion</text>
          <text x="38" y="32" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Recommended adding 'CI/CD Pipelines' & 'Docker'</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(16, 136)">
          <rect width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E9D9FF"/>
          <circle cx="20" cy="21" r="10" fill="#3B82F6" opacity="0.15"/>
          <text x="20" y="25" fill="#1D4ED8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">ℹ</text>
          <text x="38" y="18" fill="#1E1B4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Typography & Hierarchy Check</text>
          <text x="38" y="32" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Single page format with ideal 1.5 line height</text>
        </g>
      </g>
    </g>
  </g>
</svg>
